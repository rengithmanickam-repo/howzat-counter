<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Howzat - Counter</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/howzat-app-icon.png" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3880ff">
  <script>
    (function () {
      var key = 'howzat-counter/theme';
      var pref = localStorage.getItem(key);
      var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      root.classList.add(dark ? 'theme-dark' : 'theme-light');
      if (dark) root.classList.add('ion-palette-dark');
      root.dataset.theme = dark ? 'dark' : 'light';
      root.style.colorScheme = dark ? 'dark' : 'light';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#161618' : '#3880ff');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
